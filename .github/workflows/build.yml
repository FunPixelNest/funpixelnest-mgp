name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  android-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (shared logic)
        run: set -o pipefail; ./gradlew --console=plain :composeApp:testDebugUnitTest 2>&1 | tee -a ci.log

      # Opt-in: runs the app's Supabase client against the LIVE project. Add "[live-test]" to a commit message.
      - name: Live backend test (opt-in)
        if: contains(github.event.head_commit.message, '[live-test]')
        env:
          FPN_LIVE_TEST: "true"
        run: set -o pipefail; ./gradlew --console=plain :composeApp:testDebugUnitTest --tests '*LiveBackendTest*' --rerun -i 2>&1 | grep -E "LIVE:|PASSED|FAILED|Exception|expected|BUILD" | tee -a ci.log

      - name: Android debug APK
        run: set -o pipefail; ./gradlew --console=plain :composeApp:assembleDebug 2>&1 | tee -a ci.log

      # The in-chat preview page can't reach outside servers, so this web build uses the demo backend.
      # The Android APK above uses the real Supabase backend from config/backend.properties.
      - name: Web (Wasm) build (demo backend)
        env:
          FPN_DEMO_BACKEND: "true"
        run: set -o pipefail; ./gradlew --console=plain :composeApp:wasmJsBrowserDistribution 2>&1 | tee -a ci.log

      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk

      # Latest web build + debug APK on the `preview` branch (easy to fetch and share).
      - name: Collect preview files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p preview
          cp -r composeApp/build/dist/wasmJs/productionExecutable/. preview/
          cp composeApp/build/outputs/apk/debug/*.apk preview/funpixelnest-mgp-debug.apk

      - name: Publish preview branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./preview
          publish_branch: preview
          force_orphan: true

      # On failure, keep the build output readable on the `ci-logs` branch.
      - name: Save failure log
        if: failure() && github.event_name == 'push'
        run: |
          mkdir -p logs && tail -n 400 ci.log > logs/android-and-web.log || true
          grep -nE "^e: |error:|What went wrong|FAILED|Could not" ci.log | head -200 > logs/android-and-web-errors.log || true
      - name: Publish failure log
        if: failure() && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./logs
          publish_branch: ci-logs-android-and-web
          force_orphan: true

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: iOS framework (simulator)
        run: set -o pipefail; ./gradlew --console=plain :composeApp:linkDebugFrameworkIosSimulatorArm64 2>&1 | tee -a ci.log

      - name: Save failure log
        if: failure() && github.event_name == 'push'
        run: |
          mkdir -p logs && tail -n 400 ci.log > logs/ios.log || true
          grep -nE "^e: |error:|What went wrong|FAILED|Could not" ci.log | head -200 > logs/ios-errors.log || true
      - name: Publish failure log
        if: failure() && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./logs
          publish_branch: ci-logs-ios
          force_orphan: true
