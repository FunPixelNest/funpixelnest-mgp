name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  android-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (shared logic)
        run: ./gradlew :composeApp:testDebugUnitTest

      - name: Android debug APK
        run: ./gradlew :composeApp:assembleDebug

      - name: Web (Wasm) build
        run: ./gradlew :composeApp:wasmJsBrowserDistribution

      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk

      # Latest web build + debug APK on the `preview` branch (easy to fetch and share).
      - name: Collect preview files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p preview
          cp -r composeApp/build/dist/wasmJs/productionExecutable/. preview/
          cp composeApp/build/outputs/apk/debug/*.apk preview/funpixelnest-mgp-debug.apk

      - name: Publish preview branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./preview
          publish_branch: preview
          force_orphan: true

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: iOS framework (simulator)
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64
