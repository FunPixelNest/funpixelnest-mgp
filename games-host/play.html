<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>FunPixelNest Game</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0e1a33; color: #fff; overflow: hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    #msg { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 24px; color: #b9c6e4; }
  </style>
</head>
<body>
  <div id="msg">Loading…</div>
  <!--
    Game player used by the native apps (Android WebView, later iOS WKWebView).
    URL: play.html#<url-encoded launch JSON>   e.g. {"gameId":"block_puzzle","mode":"tournament","seed":"123",...}
    The page runs the game with fpn-unity-host.js (same as the web app) and reports back to the app through
    window.FPNNative (Android @JavascriptInterface) or window.webkit.messageHandlers.fpn (iOS).
  -->
  <script src="fpn-unity-host.js"></script>
  <script>
    (function () {
      var msg = document.getElementById("msg");
      function native(method, arg) {
        try {
          if (window.FPNNative && window.FPNNative[method]) { window.FPNNative[method](arg == null ? "" : String(arg)); return; }
          if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.fpn) {
            window.webkit.messageHandlers.fpn.postMessage({ method: method, arg: arg == null ? "" : String(arg) }); return;
          }
        } catch (e) { console.error(e); }
        console.log("[FPN play]", method, arg);
      }
      var launchJson = "";
      try { launchJson = decodeURIComponent((location.hash || "").slice(1)); } catch (e) { launchJson = ""; }
      var launch = {};
      try { launch = JSON.parse(launchJson); } catch (e) { launch = {}; }
      if (!launch.gameId) { msg.textContent = "No game selected."; native("onResult", ""); return; }

      var host = window.FPNHost;
      host.init("");
      host.embedded = true; // full screen: no title / pause / test buttons
      host.onPauseRequest = function () { native("onPauseRequest", ""); };
      host.onHud = function (score, secondsLeft) { native("onHud", score + "," + secondsLeft); };
      host.loadCatalog().then(function () {
        if (!host.has(launch.gameId)) { msg.textContent = "This game isn't available yet."; native("onResult", ""); return; }
        msg.textContent = "";
        host.launch(launch.gameId, launch.gameName || launch.gameId, launchJson, function (result) {
          native("onResult", result || "");
        });
        native("onReady", "");
      });
    })();
  </script>
</body>
</html>
