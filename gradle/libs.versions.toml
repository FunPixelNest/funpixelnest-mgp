[versions]
agp = "8.11.1"
android-compileSdk = "36"
android-minSdk = "24"
android-targetSdk = "36"
androidx-activity = "1.13.0"
# Kotlin 2.4 / Compose 1.11 match what supabase-kt 3.8 is built with.
composeMultiplatform = "1.11.1"
kotlin = "2.4.0"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
ktor = "3.5.1"
supabase = "3.8.0"
firebaseBom = "35.0.1"
# Ads: Google AdMob + mediation adapters (Liftoff Monetize = "vungle", Unity Ads, Mintegral).
playServicesAds = "25.5.0"
admobLiftoff = "7.7.8.1"
admobUnity = "4.21.0.0"
admobMintegral = "17.1.81.1"
crashlyticsPlugin = "3.0.8"
billing = "9.1.0"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# Supabase (backend) — https://github.com/supabase-community/supabase-kt
supabase-bom = { module = "io.github.jan-tennert.supabase:bom", version.ref = "supabase" }
supabase-auth = { module = "io.github.jan-tennert.supabase:auth-kt" }
supabase-postgrest = { module = "io.github.jan-tennert.supabase:postgrest-kt" }
supabase-realtime = { module = "io.github.jan-tennert.supabase:realtime-kt" }

# Push notifications (Android). Initialized from BackendConfig, no google-services.json needed.
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }
firebase-config = { module = "com.google.firebase:firebase-config" }
# Google Play Billing ("Remove Ads" in-app purchase).
play-billing = { module = "com.android.billingclient:billing", version.ref = "billing" }

# Ads (Android): AdMob and its mediation adapters; each adapter brings its network's SDK.
play-services-ads = { module = "com.google.android.gms:play-services-ads", version.ref = "playServicesAds" }
admob-mediation-liftoff = { module = "com.google.ads.mediation:vungle", version.ref = "admobLiftoff" }
admob-mediation-unity = { module = "com.google.ads.mediation:unity", version.ref = "admobUnity" }
admob-mediation-mintegral = { module = "com.google.ads.mediation:mintegral", version.ref = "admobMintegral" }

# HTTP engines used by the Supabase client on each platform
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-js = { module = "io.ktor:ktor-client-js", version.ref = "ktor" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
firebaseCrashlytics = { id = "com.google.firebase.crashlytics", version.ref = "crashlyticsPlugin" }
